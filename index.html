<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6c63ff">
<title>FitBuddy</title>
<style>
:root{--purple:#6c63ff;--ink:#24233a;--muted:#6e6b83;--bg:#f6f5ff;--card:#fff;--line:#e8e6f5;--green:#dff8e9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:16px;padding:15px 18px;font-weight:750;min-height:54px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffb84d;outline-offset:3px}
.primary{background:var(--purple);color:white}.secondary{background:#eeedff;color:#4c45cf}.soft{background:#f2f1f8;color:var(--ink)}.danger{background:#ffe9e9;color:#a33131}
#app{max-width:760px;margin:auto;min-height:100vh;padding:18px 16px 100px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 20px}
.brand{font-size:25px;font-weight:900;letter-spacing:-.5px}.brand span{color:var(--purple)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 6px 22px #29205c0a}
h1{font-size:28px;margin:8px 0 10px}h2{font-size:22px;margin:0 0 12px}p{line-height:1.55;color:var(--muted);margin:8px 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{min-height:112px;text-align:start;display:flex;flex-direction:column;justify-content:center;gap:6px;background:#f1f0ff;color:var(--ink);border:1px solid #e2e0ff}
.tile .emoji{font-size:27px}.tile small{font-size:14px;color:var(--muted);font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
input,select,textarea{width:100%;border:1px solid #dcd9ed;border-radius:14px;padding:14px;background:white;min-height:52px;margin:6px 0 14px;color:var(--ink)}
label{font-weight:700;display:block;margin-top:10px}
.hidden{display:none!important}.muted{color:var(--muted);font-size:14px}
#languageScreen{min-height:82vh;display:flex;flex-direction:column;justify-content:center}
.lang-choice{width:100%;text-align:start;margin:7px 0;background:white;border:2px solid var(--line);color:var(--ink);display:flex;justify-content:space-between;align-items:center}
.lang-choice.selected{border-color:var(--purple);background:#f1f0ff}
nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px max(12px,calc((100vw - 720px)/2));display:flex;gap:8px;z-index:5}
nav button{flex:1;padding:10px 6px;min-height:58px;background:transparent;color:var(--muted);font-size:14px}
nav button.active{background:#eeedff;color:#4c45cf}
nav .navemoji{display:block;font-size:20px;margin-bottom:2px}
.toast{position:fixed;bottom:88px;left:16px;right:16px;max-width:500px;margin:auto;background:#25233a;color:white;padding:14px 18px;border-radius:14px;z-index:10;text-align:center}
.modal-bg{position:fixed;inset:0;background:#17152c88;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal{background:white;border-radius:24px;padding:22px;width:min(100%,480px);max-height:90vh;overflow:auto}
.modal-actions{display:flex;gap:10px;margin-top:14px}.modal-actions button{flex:1}
.tag{display:inline-block;background:#eeedff;color:#5149cf;padding:7px 12px;border-radius:99px;margin:3px;font-size:14px}
@media(max-width:430px){#app{padding:14px 12px 100px}.panel{padding:17px}.grid{gap:9px}.tile{min-height:105px;padding:13px}h1{font-size:25px}}

#splashScreen{position:fixed;inset:0;z-index:1000;background:linear-gradient(155deg,#fffdf4,#f1f0ff 58%,#e8f7ff);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:clamp(28px,8vh,72px) 18px 30px;text-align:center}
.splash-top{font-size:clamp(23px,6vw,34px);font-weight:900;color:#302b55;margin-top:2vh}
.splash-center{margin:auto;display:flex;flex-direction:column;align-items:center;gap:18px}
.dog-ring{width:min(62vw,260px);height:min(62vw,260px);border-radius:50%;padding:9px;background:conic-gradient(from 0deg,#6c63ff,#36c6d5,#ffb84d,#6c63ff);animation:spinRing 2.4s linear infinite;box-shadow:0 12px 35px #5149cf35}
.dog-ring img{width:100%;height:100%;object-fit:cover;object-position:center 42%;border-radius:50%;border:6px solid white;display:block}
.loading-label{font-size:26px;font-weight:850;color:#4c45cf;min-height:38px}
.app-tagline{font-size:21px;font-weight:850;color:#302b55}
@keyframes spinRing{to{transform:rotate(360deg)}}
.brand-dog{width:42px;height:42px;border-radius:50%;object-fit:cover;vertical-align:middle;border:2px solid #dcd9ff}
</style>
</head>

const splashStart = Date.now();
let dotCount = 3, dotDirection = -1;
const dotInterval = setInterval(() => {
 const el = document.getElementById("loadingDots");
 if (!el) return;
 dotCount += dotDirection;
 if (dotCount <= 0) { dotCount = 0; dotDirection = 1; }
 else if (dotCount >= 3) { dotCount = 3; dotDirection = -1; }
 el.textContent = ".".repeat(dotCount);
}, 450);
window.addEventListener("load", () => {
 const wait = Math.max(0, 7000 - (Date.now() - splashStart));
 setTimeout(() => {
  clearInterval(dotInterval);
  document.getElementById("splashScreen")?.remove();
 }, wait);
});

};
let lang=localStorage.getItem("fb_lang")||"", current="home", selectedLang=lang||"he";
const $=id=>document.getElementById(id), t=k=>(translations[lang]||translations.he)[k]||k;
function direction(){document.documentElement.lang=lang;document.documentElement.dir=(lang==="he"||lang==="ar")?"rtl":"ltr"}
function showToast(msg){$("toast").textContent=msg;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),2400)}
function chooseLanguage(){
 const names={he:"עברית",en:"English",ru:"Русский",ar:"العربية"};
 $("languageChoices").innerHTML=Object.entries(names).map(([k,v])=>`<button class="lang-choice ${selectedLang===k?"selected":""}" data-lang="${k}"><span>${v}</span><span>${selectedLang===k?"✓":" "}</span></button>`).join("");
 document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{selectedLang=b.dataset.lang;chooseLanguage()});
 $("welcomeTitle").textContent=translations[selectedLang].welcome;$("welcomeText").textContent=translations[selectedLang].choose;$("continueBtn").textContent=translations[selectedLang].continue;
 $("languageScreen").dir=(selectedLang==="he"||selectedLang==="ar")?"rtl":"ltr";
}
function startApp(){lang=selectedLang;localStorage.setItem("fb_lang",lang);direction();$("languageScreen").classList.add("hidden");$("mainScreen").classList.remove("hidden");$("nav").classList.remove("hidden");render()}
$("continueBtn").onclick=startApp;chooseLanguage();
if(lang){selectedLang=lang;startApp()}
function go(page){current=page;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));render()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.page));
$("settingsTop").onclick=()=>go("settings");
function getItems(key){try{return JSON.parse(localStorage.getItem(key)||"[]")}catch{return []}}
function render(){
 const page=$("page");
 if(current==="home") page.innerHTML=`<div class="panel"><h1>${t("hello")}</h1><p>${t("homeSub")}</p><div class="grid"><button class="tile" data-go="food"><span class="emoji">🍎</span><strong>${t("food")}</strong><small>${t("foodTitle")}</small></button><button class="tile" data-go="sport"><span class="emoji">⚽</span><strong>${t("sport")}</strong><small>${t("sportTitle")}</small></button></div></div><div class="panel"><h2>לשמור על הבריאות👍</h2><p>${t("start")}</p></div>`;
 if(current==="food") page.innerHTML=`<div class="panel"><h1>${t("foodTitle")}</h1><p>${t("foodSub")}</p><label>${lang==="he"?"צילום הארוחה (אפשר גם בלי צילום)":lang==="en"?"Meal photo (optional)":lang==="ru"?"Фото блюда (необязательно)":"صورة الوجبة (اختياري)"}</label>
<div class="row">
 <button class="secondary" type="button" id="chooseFoodPhoto">🖼️ ${t("photo")}</button>
 <button class="secondary" type="button" id="takeFoodPhoto">📷 ${lang==="he"?"צילום במצלמה":lang==="en"?"Take a photo":lang==="ru"?"Сфотографировать":"التقاط صورة"}</button>
</div>
<input id="foodPhoto" type="file" accept="image/*" class="hidden">
<input id="cameraPhoto" type="file" accept="image/*" capture="environment" class="hidden">
<p class="muted">${lang==="he"?"אפשר לצלם, לכתוב מה אכלת, או לעשות את שניהם.":lang==="en"?"You can take a photo, write what you ate, or do both.":lang==="ru"?"Можно добавить фото, написать, что вы ели, или сделать и то и другое.":"يمكنك التقاط صورة أو كتابة ما تناولته أو القيام بالأمرين معًا."}</p>
<label>${t("meal")} <span class="muted">(לא חובה)</span></label><input id="mealText" placeholder="${t("mealHint")}"><button class="primary" id="showNutrition" style="width:100%">הצגת מידע על הארוחה</button></div><div id="nutritionResult"></div>`;
 if(current==="sport") page.innerHTML=`<div class="panel"><h1>${t("sportTitle")}</h1><p>${t("sportSub")}</p><div class="grid"><button class="tile" data-activity="morning"><span class="emoji">🌅</span><strong>${t("morning")}</strong></button><button class="tile" data-activity="general"><span class="emoji">🏃</span><strong>${t("general")}</strong></button><button class="tile" data-activity="pilates"><span class="emoji">🧘</span><strong>${t("pilates")}</strong></button><button class="tile" id="openLog"><span class="emoji">📝</span><strong>${t("logActivity")}</strong></button></div></div><div class="panel"><h2>${t("savedItems")}</h2><div id="activityList"></div></div>`;
 if(current==="settings") page.innerHTML=`<div class="panel"><h1>${t("settingsTitle")}</h1><label>${t("language")}</label><select id="langSelect"><option value="he">עברית</option><option value="en">English</option><option value="ru">Русский</option><option value="ar">العربية</option></select><button class="primary" id="applyLang" style="width:100%">${t("changeLang")}</button></div><div class="panel"><h2>${t("reminders")}</h2><label><input type="checkbox" id="sportReminder" style="width:auto;min-height:auto"> ${t("sportsReminder")}</label><label><input type="checkbox" id="foodReminder" style="width:auto;min-height:auto"> ${t("foodReminder")}</label><p class="muted">הפעלת תזכורות דורשת הרשאות והתאמה למכשיר.</p></div><div class="panel"><button class="soft" id="restartLang" style="width:100%">${t("changeLang")}</button></div>`;
 if(current==="food"){
  $("chooseFoodPhoto").onclick=()=>$("foodPhoto").click();
  $("takeFoodPhoto").onclick=()=>$("cameraPhoto").click();
  $("showNutrition").onclick=showNutritionInfo;
 }
 if(current==="sport"){document.querySelectorAll("[data-activity]").forEach(b=>b.onclick=()=>openActivityModal(t(b.dataset.activity)));$("openLog").onclick=()=>openActivityModal("") ;drawActivities()}
 if(current==="settings"){ $("langSelect").value=lang;$("sportReminder").checked=localStorage.getItem("fb_sr")==="1";$("foodReminder").checked=localStorage.getItem("fb_fr")==="1";$("applyLang").onclick=()=>{selectedLang=$("langSelect").value;lang=selectedLang;localStorage.setItem("fb_lang",lang);direction();render();document.querySelectorAll("nav [data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n))};$("sportReminder").onchange=e=>localStorage.setItem("fb_sr",e.target.checked?"1":"0");$("foodReminder").onchange=e=>localStorage.setItem("fb_fr",e.target.checked?"1":"0");$("restartLang").onclick=()=>{selectedLang=lang;$("mainScreen").classList.add("hidden");$("nav").classList.add("hidden");$("languageScreen").classList.remove("hidden");chooseLanguage()}}
 page.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
 document.querySelectorAll("nav [data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
}
async function showNutritionInfo(){
 const file=$("cameraPhoto").files[0]||$("foodPhoto").files[0],desc=$("mealText").value.trim();
 if(!file&&!desc){showToast(lang==="he"?"צריך להוסיף צילום או לכתוב מה אכלת.":lang==="en"?"Add a photo or write what you ate.":lang==="ru"?"Добавьте фото или напишите, что вы ели.":"أضف صورة أو اكتب ما تناولته.");return}
 const result=$("nutritionResult");
 const labels={
  he:{loading:"בודק את התמונה…",title:"🥗 מה זיהינו בארוחה?",food:"מאכלים שזוהו",ingredients:"מרכיבים אפשריים",protein:"מקורות חלבון",carbs:"מקורות לפחמימות",vitamins:"ויטמינים ומינרלים אפשריים",benefits:"איך המזון יכול לתרום לגוף",uncertain:"חשוב לדעת",again:"בדיקת ארוחה נוספת",error:"לא הצלחנו לנתח את התמונה כרגע. אפשר לנסות שוב.",notSure:"לא ניתן לזהות בביטחון מהתמונה הזו.",disclaimer:"הזיהוי מבוסס על תמונה בלבד ועלול לטעות. המידע כללי ואינו תחליף לייעוץ מקצועי."},
  en:{loading:"Analyzing the photo…",title:"🥗 What did we recognize?",food:"Foods recognized",ingredients:"Possible ingredients",protein:"Protein sources",carbs:"Carbohydrate sources",vitamins:"Possible vitamins and minerals",benefits:"How these foods can support the body",uncertain:"Good to know",again:"Check another meal",error:"We couldn't analyze the photo right now. Please try again.",notSure:"We couldn't confidently identify this image.",disclaimer:"Image recognition can be mistaken. This is general information, not professional advice."},
  ru:{loading:"Анализируем фото…",title:"🥗 Что удалось распознать?",food:"Распознанные продукты",ingredients:"Возможные ингредиенты",protein:"Источники белка",carbs:"Источники углеводов",vitamins:"Возможные витамины и минералы",benefits:"Чем эти продукты могут быть полезны",uncertain:"Важно знать",again:"Проверить другое блюдо",error:"Не удалось проанализировать фото. Попробуйте ещё раз.",notSure:"Не удалось уверенно распознать изображение.",disclaimer:"Распознавание по фото может ошибаться. Информация общая и не заменяет консультацию специалиста."},
  ar:{loading:"جارٍ تحليل الصورة…",title:"🥗 ماذا تعرّفنا على الطعام؟",food:"الأطعمة التي تم التعرف عليها",ingredients:"مكونات محتملة",protein:"مصادر البروتين",carbs:"مصادر الكربوهيدرات",vitamins:"فيتامينات ومعادن محتملة",benefits:"كيف يمكن أن تفيد هذه الأطعمة الجسم",uncertain:"معلومة مهمة",again:"تحليل وجبة أخرى",error:"تعذر تحليل الصورة الآن. حاول مرة أخرى.",notSure:"لم نتمكن من تحديد الصورة بثقة.",disclaimer:"قد يخطئ التعرف على الصور. هذه معلومات عامة وليست بديلاً عن استشارة مختص."}
 };
 const L=labels[lang]||labels.he;
 result.innerHTML=`<div class="panel"><p>${L.loading}</p><div class="spinner" aria-label="${L.loading}"></div></div>`;
 try{
  const form=new FormData();
  if(file) form.append("photo",file);
  form.append("description",desc);
  form.append("language",lang);
  const response=await fetch("/api/analyze-meal",{method:"POST",body:form});
  const payload=await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(payload.error||"analysis_failed");
  const data=payload.analysis||{};
  const list=(value)=>Array.isArray(value)&&value.length?`<ul>${value.map(x=>`<li>${escapeHtml(String(x))}</li>`).join("")}</ul>`:`<p>${L.notSure}</p>`;
  const section=(title,value)=>`<h3>${title}</h3>${list(value)}`;
  result.innerHTML=`<div class="panel">
   <h2>${L.title}</h2>
   ${file?`<img src="${URL.createObjectURL(file)}" alt="תמונת הארוחה" style="width:100%;max-height:240px;object-fit:contain;border-radius:16px;background:#f5f4fa">`:""}
   ${section(L.food,data.foods)}
   ${section(L.ingredients,data.ingredients)}
   ${section(L.protein,data.protein_sources)}
   ${section(L.carbs,data.carbohydrate_sources)}
   ${section(L.vitamins,data.vitamins_minerals)}
   ${section(L.benefits,data.benefits)}
   <h3>${L.uncertain}</h3><p>${escapeHtml(data.uncertainty_note||L.disclaimer)}</p>
   <p class="muted">${L.disclaimer}</p>
   <button class="secondary" id="newMeal" style="width:100%">${L.again}</button>
  </div>`;
  $("newMeal").onclick=()=>{$("foodPhoto").value="";$("cameraPhoto").value="";$("mealText").value="";$("nutritionResult").innerHTML="";};
 }catch(err){
  const msg=err.message==="service_not_configured"?"יש להגדיר מפתח API בשרת לפני השימוש.":L.error;
  result.innerHTML=`<div class="panel"><p>${escapeHtml(msg)}</p><button class="secondary" id="retryMeal" style="width:100%">נסה שוב</button></div>`;
  $("retryMeal").onclick=showNutritionInfo;
 }
}
function drawMeals(){const el=$("mealList");if(!el)return;const a=getItems("fb_meals");el.innerHTML=a.length?a.map(x=>`<div class="row" style="align-items:center;border-top:1px solid var(--line);padding:10px 0"><img src="${x.img}" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:12px"><div><b>${escapeHtml(x.desc)}</b><div class="muted">${x.date}</div></div></div>`).join(""):`<p>${t("empty")}</p>`}
function openActivityModal(activity){$("modalRoot").innerHTML=`<div class="modal-bg"><div class="modal"><h2>${t("logActivity")}</h2><label>${t("activity")}</label><input id="actName" value="${escapeHtml(activity)}" placeholder="${t("general")}"><label>${t("duration")}</label><input id="actDuration" type="number" min="1" max="600" placeholder="20"><label>${t("effort")}</label><select id="actEffort"><option value="easy">${t("easy")}</option><option value="medium">${t("medium")}</option><option value="hard">${t("hard")}</option></select><div class="modal-actions"><button class="soft" id="cancelModal">${t("cancel")}</button><button class="primary" id="saveActivity">${t("set")}</button></div></div></div>`;
 $("cancelModal").onclick=()=>$("modalRoot").innerHTML="";$("saveActivity").onclick=()=>{const name=$("actName").value.trim(),mins=Number($("actDuration").value);if(!name||!mins||mins<1){showToast(t("nameNeeded"));return}let a=getItems("fb_activities");a.unshift({name,mins,effort:$("actEffort").value,date:new Date().toLocaleDateString()});localStorage.setItem("fb_activities",JSON.stringify(a.slice(0,50)));$("modalRoot").innerHTML="";drawActivities();showToast(t("activitySaved"))}}
function drawActivities(){const el=$("activityList");if(!el)return;const a=getItems("fb_activities");el.innerHTML=a.length?a.map(x=>`<div style="padding:10px 0;border-top:1px solid var(--line)"><b>${escapeHtml(x.name)}</b> <span class="tag">${x.mins} min</span><div class="muted">${x.date}</div></div>`).join(""):`<p>${t("empty")}</p>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script>
</body></html>
